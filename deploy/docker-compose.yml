services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datamind
      POSTGRES_PASSWORD: datamind
      POSTGRES_DB: datamind
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: prod
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://datamind:datamind@postgres:5432/datamind
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      MODEL_DEFAULT: ${MODEL_DEFAULT:-deepseek/deepseek-chat}
      EMBEDDING_DEFAULT: ${EMBEDDING_DEFAULT:-openai/text-embedding-3-small}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      FERNET_KEY: ${FERNET_KEY}
    depends_on:
      - postgres
      - qdrant
      - redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  qdrant_storage:
  pg_data:

